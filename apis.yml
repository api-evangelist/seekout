aid: seekout
name: SeekOut
description: >-
  SeekOut is an agentic AI recruiting platform, founded in 2017 and headquartered
  in Bellevue, Washington, that helps talent acquisition teams source, screen, and
  engage candidates at scale across a database of 1B+ candidate profiles. Its
  products include SeekOut Recruit (AI sourcing, screening, and personalized
  outreach), SeekOut Spot (an AI recruiting service pairing agentic AI with expert
  recruiters), SeekOut Sam (AI inbound applicant evaluation), and SeekOut MCP, a
  hosted Model Context Protocol server that brings 14 built-in recruiting workflows
  into Claude, ChatGPT, Gemini, and Microsoft 365 Copilot. SeekOut is used by 750+
  customers including Microsoft, DocuSign, Sony, and Thomson Reuters.
